# -----------------------------------------------------------------------------
# Scholar
# -----------------------------------------------------------------------------
 
scholar:
  last_name: [Fofrich, Fofrich Navarro]
  first_name: [Robert, R, Robert A., R. A.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
 
# -----------------------------------------------------------------------------
# Publication badges
# -----------------------------------------------------------------------------
# NOTE: verify this key against your _layouts/bib.liquid before relying on it.
# Older al-folio versions use a flat `enable_publication_badges: true` plus a
# separate `altmetric_badge_type:` key instead of the nested form below.
 
enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
 
