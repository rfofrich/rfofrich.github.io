# -----------------------------------------------------------------------------
# Theme settings
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

enable_darkmode: true
enable_masonry: true
enable_project_categories: true
enable_medium_zoom: true
enable_math: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    output: true
  projects:
    output: true
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  source: /_bibliography/
  bibliography: papers.bib
  style: apa
  locale: en
  bibtex_filters: [latex, smallcaps, superscript]
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true

# -----------------------------------------------------------------------------
# Include & exclude
# -----------------------------------------------------------------------------

include: ["_pages", "_scripts"]
exclude:
  - bin/
  - vendor
  - README.md
keep_files:
  - CNAME
  - .nojekyll
