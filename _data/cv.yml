    Skills:
      - name: Research
        keywords: "Climate change mitigation and risk; energy-system decarbonization; committed emissions and stranded assets; climate attribution; carbon removal; climate impacts on agriculture and ecosystems; climate finance and accountability."

      - name: Quantitative Methods
        keywords: "Python (Pandas, NumPy, SciPy, xarray, Dask, xclim), MATLAB, ArcGIS/GIS, statistical and geospatial analysis, Monte Carlo uncertainty analysis, climate-model and integrated-assessment-model analysis."

      - name: Data
        keywords: "Earth system and climate-model output, reanalysis, remote sensing, emissions inventories, asset-level energy and finance databases, land-use and ecological datasets."

      - name: Scientific Communication
        keywords: "Peer-reviewed publications, technical reports, public-facing research communication, interdisciplinary collaboration, and presentations to scientific, policy, and community audiences."

      - name: Languages
        keywords: "English and Spanish (fluent)"

