cv:
  name: Robert Fofrich Navarro
  label: Postdoctoral Research Associate
  email: robertfofrich@dartmouth.edu
  location: Hanover, NH
  image: ""
  summary: >
    I study how decisions about energy, infrastructure, land, and climate policy shape
    climate risk, and where interventions can most effectively reduce it. My research
    spans energy system decarbonization, climate intervention and carbon removal,
    climate impacts, and attribution.

